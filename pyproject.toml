[project]
name = "reviewpilot-backend"
version = "0.1.0"
description = "ReviewPilot backend — AI review-response lead engine + monitoring SaaS"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "httpx>=0.27",
    "outscraper>=6.0",
    "anthropic>=0.40",
    "boto3>=1.34",
    "py3langid>=0.3",
    "pyjwt>=2.9",
    "email-validator>=2.0",
    "stripe>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# The prompt text must stay character-for-character identical to docs/sprints/SPRINT_02.md
# §Prompt v1 (enforced by tests/test_prompts.py), so its long lines can't be rewrapped.
"app/prompts.py" = ["E501"]
# Same reason for the outreach template (tests/test_templates.py enforces doc parity).
"app/templates.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
